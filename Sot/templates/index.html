<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom AI Assistant - Railway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Custom AI Assistant</h1>
            <p>Deployed on Railway 🚆 | Your personal AI for coding help and explanations</p>
        </header>

        <div class="chat-container">
            <div id="chat-messages" class="chat-messages">
                <div class="message ai-message">
                    <strong>AI:</strong> Hello! I'm your custom AI assistant deployed on Railway! 🚆 How can I help you today?
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>

        <div class="suggestions">
            <p>Try asking about:</p>
            <div class="suggestion-buttons">
                <button class="suggestion-btn" data-question="Show me a Python Flask example">Flask Example</button>
                <button class="suggestion-btn" data-question="What is Railway?">Railway</button>
                <button class="suggestion-btn" data-question="Help with web deployment">Deployment</button>
                <button class="suggestion-btn" data-question="What can you do?">Capabilities</button>
            </div>
        </div>

        <footer>
            <p>🚀 Deployed on <a href="https://railway.app" target="_blank">Railway</a> | Built with Flask & Python</p>
        </footer>
    </div>

    <script>
        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        document.querySelectorAll('.suggestion-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.getElementById('user-input').value = this.dataset.question;
                sendMessage();
            });
        });

        function sendMessage() {
            const userInput = document.getElementById('user-input');
            const message = userInput.value.trim();
            
            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            userInput.value = '';

            // Show loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message loading';
            loadingDiv.innerHTML = '<strong>AI:</strong> Thinking...';
            document.getElementById('chat-messages').appendChild(loadingDiv);
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;

            // Send to AI
            fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({message: message})
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                // Remove loading indicator
                document.querySelector('.loading').remove();
                addMessage(data.response, 'ai');
            })
            .catch(error => {
                console.error('Error:', error);
                document.querySelector('.loading').remove();
                addMessage('Sorry, I encountered an error. Please try again.', 'ai');
            });
        }

        function addMessage(text, sender) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.innerHTML = `<strong>${sender === 'user' ? 'You' : 'AI'}:</strong> ${formatMessage(text)}`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function formatMessage(text) {
            // Simple formatting for code blocks
            return text.replace(/```python\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                      .replace(/`([^`]+)`/g, '<code>$1</code>')
                      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                      .replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
